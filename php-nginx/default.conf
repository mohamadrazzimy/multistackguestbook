server {
    listen 80;
    root /var/www/html;
    client_max_body_size 16k;
    location = / {
        try_files /index.html =404;
    }
    location = /api/entries {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_pass php:9000;
    }
    location / { return 404; }
}
