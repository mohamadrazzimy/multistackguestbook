services:
  php-apache:
    build: ./php-apache
    ports: ["127.0.0.1:8081:80"]
    volumes: ["php-apache-data:/data"]
  php-fpm:
    build: ./php-nginx
    volumes: ["php-nginx-data:/data"]
    networks:
      default:
        aliases: [php]
  nginx:
    image: nginx:alpine
    ports: ["127.0.0.1:8082:80"]
    volumes:
      - ./php-nginx/index.html:/var/www/html/index.html:ro
      - ./php-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php-fpm]
  java:
    build: ./java
    ports: ["127.0.0.1:8083:8080"]
    volumes: ["java-data:/data"]
  spring:
    build: ./spring
    ports: ["127.0.0.1:8084:8080"]
    volumes: ["spring-data:/data"]
  aspnet:
    build: ./aspnet
    ports: ["127.0.0.1:8085:8080"]
    volumes: ["aspnet-data:/data"]
  node:
    build: ./node
    ports: ["127.0.0.1:8086:3000"]
    volumes: ["node-data:/data"]
  python:
    build: ./python
    ports: ["127.0.0.1:8087:8000"]
    volumes: ["python-data:/data"]
volumes:
  php-apache-data:
  php-nginx-data:
  java-data:
  spring-data:
  aspnet-data:
  node-data:
  python-data:
